---
- name: Test 1Password field lookup
  hosts: all
  gather_facts: false
  collections:
    - onepassword.connect
  vars:
    vault: "{{ lookup_vault | default('semaphore') }}"
    item: "{{ lookup_item | default('test-item') }}"
    field: "{{ lookup_field | default('password') }}"
  tasks:
    - name: Get field from 1Password item
      onepassword.connect.field_info:
        hostname: "{{ runtime_secret_endpoint | default(omit) }}"
        token: "{{ runtime_secret_token | default(omit) }}"
        vault: "{{ vault }}"
        item: "{{ item }}"
        field: "{{ field }}"
      delegate_to: localhost
      run_once: true
      no_log: true
      register: op_field

    - name: Confirm field was retrieved
      run_once: true
      ansible.builtin.debug:
        msg: "Retrieved field '{{ field }}' from item '{{ item }}' in vault '{{ vault }}' (value length: {{ op_field.field.value | length }})"
