# Playbook: Example Playbook
# This is a template playbook showing how to use vault secrets

- name: Example Playbook
  hosts: all
  become: true
  
  vars:
    # Vault secrets are loaded from encrypted files
    # The 1Password integration is hidden from this playbook
    db_password: "{{ vault_db_password }}"
    api_key: "{{ vault_api_key }}"
  
  pre_tasks:
    - name: Include vault secrets
      include_vars: vault/database.vault.yml
      vars:
        vault_db_password: "{{ db_password }}"
    
    - name: Include API keys vault
      include_vars: vault/api_keys.vault.yml
      vars:
        vault_api_key: "{{ api_key }}"
  
  tasks:
    - name: Example task using secret
      debug:
        msg: "Running with configured secrets"
    
    - name: Example database task
      debug:
        msg: "Database password is configured (not shown for security)"
