---
# tasks/secrets.yml
# Load secrets from 1Password using op command
# Note: This file is included but the actual secret loading is abstracted

- name: Load example secret from 1Password
  ansible.builtin.command: op read "op://example/example_secret"
  register: example_secret_result
  changed_when: false
  no_log: true

- name: Set example secret as fact
  ansible.builtin.set_fact:
    example_secret: "{{ example_secret_result.stdout }}"
  no_log: true
